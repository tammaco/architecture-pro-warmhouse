events {
    worker_connections 1024;
}

http {
    upstream app_monolith {
        server app:8080;  
    }

    upstream device_api {
        server device-api:8080;  
    }

    upstream telemetry_api {
        server telemetry-api:5001;  
    }

    server {
        listen 80;
        listen 8080; 
        server_name localhost;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Old 
        location /api/v1/sensors {
            rewrite ^/api/v1/sensors(.*)$ /api/v2/devices$1 break;
            proxy_pass http://device_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header X-API-Version "v1-redirected-to-v2" always;
            add_header X-Backend-Service "device-api" always;
        }

        location /api/v1/ {
            proxy_pass http://app_monolith;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            add_header X-API-Version "v1-legacy" always;
            add_header X-Deprecated "true" always;
        }

        # New
        location /api/v2/devices/ {
            proxy_pass http://device_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            add_header X-API-Version "v2" always;
            add_header X-Backend-Service "device-api" always;
        }

        location /api/v2/telemetry/ {
            proxy_pass http://telemetry_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            add_header X-API-Version "v2" always;
            add_header X-Backend-Service "telemetry-api" always;
        }

        # Health
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        # Root
        location / {
            default_type application/json;
            return 200 '{
                "service": "Smart Home API Gateway",
                "versions": {
                    "v1": "/api/v1/ (legacy)",
                    "v2": "/api/v2/ (current)"
                }
            }';
        }
    }
}