services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  temperature-api:
    build: 
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    expose: 
      - "8181"
    networks:
      - smarthome-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=smarthome
      - DATABASE_URL=postgres://postgres:password@postgres:5432/smarthome?sslmode=disable
      - TEMPERATURE_API_URL=http://temperature-api:8081
    expose: 
      - "8080"
    restart: unless-stopped
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  device-api:
    build:
      context: ./warmhouse-api/DeviceApi
      dockerfile: Dockerfile
    container_name: device-api
    ports:
      - "8082:8080" 
    environment:
      - ASPNETCORE_URLS=http://+:8080  
      - ASPNETCORE_URLS=http://+:8080
      - TelemetryApi__BaseUrl=http://telemetry-api:5001 
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"] 
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  telemetry-api:
    build:
      context: ./warmhouse-api/TelemetryApi
      dockerfile: Dockerfile
    container_name: telemetry-api
    ports:
      - "8083:5001" 
    environment:
      - FLASK_ENV=development
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx-router:
    image: nginx:alpine
    container_name: nginx-router
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - temperature-api
      - device-api
      - telemetry-api
    networks:
      - smarthome-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge